<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback: send unknown paths back to the app's hash router.
      var segments = location.pathname.split('/').filter(Boolean);
      var base = segments.length ? '/' + segments[0] + '/' : '/';
      location.replace(base + '#/');
    </script>
  </head>
  <body></body>
</html>
